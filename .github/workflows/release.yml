name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write # mandatory for npm trusted publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing (OIDC) needs npm >= 11.5.1 AND Node >= 22.14.0 — both
      # halves are enforced registry-side, and a too-old Node fails as a
      # misleading ENEEDAUTH rather than a version error. Node 24 ships npm 11.x
      # already; upgrading to latest keeps us ahead of the moving floor.
      - name: Upgrade npm
        run: |
          npm install -g npm@latest
          node --version && npm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # @changesets/cli 2.31 does not forward --provenance to npm; this env var
          # is what actually turns on provenance generation during `npm publish`.
          # OIDC trusted publishing supplies auth — no NPM_TOKEN anywhere. It
          # requires npm >= 11.5.1 on Node >= 22.14.0 (see the runner setup above).
          NPM_CONFIG_PROVENANCE: true
